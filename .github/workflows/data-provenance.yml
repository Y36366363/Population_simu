name: Check data provenance

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  provenance:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Validate observed-data provenance
        run: python scripts/check_data_provenance.py
      - name: Test the provenance guard
        run: python -m unittest tests.test_data_provenance
